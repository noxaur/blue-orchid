name: deploy

# A separate workflow from ci, which cancels a run when a newer push arrives, and a deploy cut off mid-migration
# would leave D1 half-applied.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# By default a newly queued run cancels the one already waiting, so a stale rerun could push out the deploy of
# main's tip.
concurrency:
  group: deploy-tracker
  cancel-in-progress: false
  queue: max

jobs:
  tracker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - working-directory: apps/tracker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A rerun of ci on an older commit must not deploy it over a newer one, whose migrations stay applied.
          tip=$(git ls-remote --exit-code origin refs/heads/main)
          if [ "${tip%%[[:space:]]*}" != "$HEAD_SHA" ]; then
            echo "deploy: skipped, $HEAD_SHA is no longer the tip of main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Without the lock file a deploy cannot find the resources an earlier one made, and makes new ones.
          if [ ! -f void.lock.json ]; then
            echo "::error::apps/tracker/void.lock.json is missing. Deploy once by hand with \`pnpm --filter @blue-orchid/tracker exec void deploy --platform cloudflare\`, then commit the void.lock.json it writes."
            exit 1
          fi
          pnpm install --frozen-lockfile
          # The saved target lives in the git-ignored .void/, so a fresh checkout must name it.
          pnpm exec void deploy --platform cloudflare
      - uses: ./.github/actions/time-limit
        with:
          warm: ${{ steps.cache.outputs.cache-hit }}
